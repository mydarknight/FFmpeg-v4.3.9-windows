name: Build FFmpeg 4.3.9 Windows x64

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击运行
  push:
    branches:
      - main

jobs:
  build:
    name: Build FFmpeg Static Binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # GitHub 免费 runner 最长运行时间为 6 小时

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            subversion ragel curl texinfo g++ bison flex cvs yasm automake \
            libtool autoconf gcc cmake git make pkg-config zlib1g-dev unzip pax \
            nasm gperf autogen bzip2 autoconf-archive p7zip-full meson \
            ninja-build clang python3-pip python3-setuptools python3-wheel \
            python-is-python3

      - name: Setup Build Helper Script
        run: |
          git clone --depth=1 https://github.com/rdp/ffmpeg-windows-build-helpers.git build-helpers
          cd build-helpers

          # 1. 下载官方 SVT-AV1 v0.8.4 针对 FFmpeg 4.x 的专用补丁
          curl -fsSL https://gitlab.com/AOMediaCodec/SVT-AV1/-/raw/v0.8.4/ffmpeg_plugin/0001-Add-ability-for-ffmpeg-to-run-svt-av1.patch -o /tmp/svtav1_ffmpeg4.patch

          # 2. 在 FFmpeg 解压/检出后自动应用 SVT-AV1 补丁
          sed -i 's@  cd \$output_dir@  cd \$output_dir\n    git apply --ignore-whitespace /tmp/svtav1_ffmpeg4.patch || patch -p1 < /tmp/svtav1_ffmpeg4.patch || true@' cross_compile_ffmpeg.sh

          # 3. 继续打适合 FFmpeg 4.4 分支的补丁
          sed -i 's|      config_options+=" --enable-libsvtav1"|      if [[ \$ffmpeg_git_checkout_version == *"n4"* ]]; then git am "\$work_dir/SVT-AV1_git/ffmpeg_plugin/n4.4"/*.patch; fi\n      config_options+=" --enable-libsvtav1"|' cross_compile_ffmpeg.sh

          # 4. 继续打官方补丁
          sed -i 's|      config_options+=" --enable-libsvtav1"|      git am "\$work_dir/SVT-AV1_git/.gitlab/workflows/linux/0001-avcodec-libsvtav1-unbreak-build-with-latest-svtav1.patch"\n      git am "\$work_dir/SVT-AV1_git/.gitlab/workflows/linux/0001-avcodec-libsvtav1-rename-aq_mode-for-v4.0.0.patch"\n      config_options+=" --enable-libsvtav1"|' cross_compile_ffmpeg.sh

          # 5. 修复 aom 仓储 CMake 路径变更
          sed -i 's|\.\./build/cmake/toolchains|\.\./cmake/toolchains|g' cross_compile_ffmpeg.sh || true

          # 6. 移除 FFmpeg 4.3 不支持或在旧交叉环境报错的新增选项
          sed -i 's/--enable-libaribcaption//g' cross_compile_ffmpeg.sh
          sed -i 's/--enable-filter=drawtext//g' cross_compile_ffmpeg.sh
          sed -i 's/--enable-libharfbuzz//g' cross_compile_ffmpeg.sh
          # sed -i 's/--enable-libsvtav1//g' cross_compile_ffmpeg.sh
          sed -i 's/--enable-vulkan//g' cross_compile_ffmpeg.sh

          # 7. 【完美解决 lame 崩溃】为 lame configure 加上 --disable-hardening 选项（Issue #783 官方方案）
          sed -i 's/generic_configure "--enable-nasm --enable-libmpg123"/generic_configure "--enable-nasm --enable-libmpg123 --disable-hardening"/' cross_compile_ffmpeg.sh

      - name: Run Cross-Compilation
        working-directory: build-helpers
        run: |
          # 参数说明：
          # --compiler-flavors=win64          : 目标架构为 Windows 64-bit
          # --ffmpeg-git-checkout-version=... : 锁定为官方 tag n4.3.9
          # --build-ffmpeg-static=y           : 生成独立的静态单文件 exe
          # --build-ffmpeg-shared=n           : 禁用 DLL 动态链接
          # --enable-gpl=y                    : 启用 GPL 编码器（x264, x265, xvid）
          # --disable-nonfree=n               : 允许 nonfree 协议，从而构建 libfdk-aac
          # --build-intel-qsv=y               : 构建并启用 Intel QSV (libmfx)
          # --build-amd-amf=y                 : 构建并启用 AMD AMF
          # NVENC/NVDEC 脚本已针对 n4.* 自动匹配拉取兼容版本的 nv-codec-headers
          
          ./cross_compile_ffmpeg.sh \
            --compiler-flavors=win64 \
            --ffmpeg-git-checkout-version=n4.3.9 \
            --build-ffmpeg-static=y \
            --build-ffmpeg-shared=n \
            --enable-gpl=y \
            --disable-nonfree=n \
            --build-intel-qsv=y \
            --build-amd-amf=y

      - name: Collect Output Binaries
        run: |
          mkdir -p output

          # 寻找生成的目标主程序目录（处理带 fdk-aac 的实际产物路径）
          SRC_DIR=$(find build-helpers/sandbox/win64 -maxdepth 1 -type d -name "ffmpeg_git_*" | head -n 1)
          
          echo "Found source directory: $SRC_DIR"
          
          # 精准拷贝主程序，排除 *_g.exe (调试版) 以及其他依赖库的测试 exe
          for bin in ffmpeg ffprobe ffplay; do
            if [ -f "$SRC_DIR/$bin.exe" ]; then
              cp "$SRC_DIR/$bin.exe" output/
            fi
          done

          # 使用交叉编译工具链中的 strip 剥离符号，完成终极瘦身
          STRIP_TOOL=$(find build-helpers/sandbox/cross_compilers -name "x86_64-w64-mingw32-strip" | head -n 1)
          if [ -n "$STRIP_TOOL" ]; then
            echo "Stripping binaries with $STRIP_TOOL..."
            $STRIP_TOOL output/*.exe
          fi

          echo "Final deliverables:"
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-4.3.9-win64-static
          path: output/
          retention-days: 90
