name: Build FFmpeg 4.3.9 (Win64 static, nonfree, MF)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >
            base-devel
            git
            curl
            autoconf
            automake
            libtool
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-pkg-config

      - name: Install external codec libs (optional, failures tolerated)
        run: |
          for p in \
            mingw-w64-x86_64-x264 \
            mingw-w64-x86_64-x265 \
            mingw-w64-x86_64-libvpx \
            mingw-w64-x86_64-libvorbis \
            mingw-w64-x86_64-opus \
            mingw-w64-x86_64-lame \
            mingw-w64-x86_64-libtheora \
            mingw-w64-x86_64-speex \
            mingw-w64-x86_64-libgsm \
            mingw-w64-x86_64-opencore-amr \
            mingw-w64-x86_64-vo-amrwbenc \
            mingw-w64-x86_64-wavpack \
            mingw-w64-x86_64-libwebp \
            mingw-w64-x86_64-libdav1d \
            mingw-w64-x86_64-aom \
            mingw-w64-x86_64-rav1e \
            mingw-w64-x86_64-xvidcore \
            mingw-w64-x86_64-libbluray \
            mingw-w64-x86_64-libssh \
            mingw-w64-x86_64-libass \
            mingw-w64-x86_64-freetype \
            mingw-w64-x86_64-fribidi \
            mingw-w64-x86_64-harfbuzz \
            mingw-w64-x86_64-zimg \
            mingw-w64-x86_64-libzvbi \
            mingw-w64-x86_64-libmysofa \
            mingw-w64-x86_64-openmpt \
            mingw-w64-x86_64-libbs2b \
            mingw-w64-x86_64-libilbc \
            mingw-w64-x86_64-libmodplug \
            mingw-w64-x86_64-twolame \
            mingw-w64-x86_64-soxr \
            mingw-w64-x86_64-libgme \
            mingw-w64-x86_64-vid.stab \
            mingw-w64-x86_64-libxml2 \
            mingw-w64-x86_64-gmp \
            mingw-w64-x86_64-gnutls \
            mingw-w64-x86_64-srt \
            mingw-w64-x86_64-zeromq \
            mingw-w64-x86_64-librist ; do
            pacman -S --needed --noconfirm "$p" || echo "WARN: skip $p"
          done

      - name: Build fdk-aac 2.0.2 (static, nonfree)
        run: |
          set -e
          git clone --depth 1 --branch v2.0.2 https://github.com/mstorsjo/fdk-aac.git
          cd fdk-aac
          autoreconf -fiv
          ./configure --prefix=/mingw64 --enable-static --disable-shared
          make -j"$(nproc)"
          make install

      - name: Download FFmpeg 4.3.9
        run: |
          set -e
          curl -L -o ffmpeg-4.3.9.tar.xz https://ffmpeg.org/releases/ffmpeg-4.3.9.tar.xz
          tar xf ffmpeg-4.3.9.tar.xz

      - name: Configure FFmpeg
        run: |
          set -e
          cd ffmpeg-4.3.9
          ./configure \
            --pkg-config-flags="--static" \
            --extra-ldflags="-static" \
            --enable-gpl \
            --enable-nonfree \
            --enable-version3 \
            --enable-libfdk-aac \
            --enable-static \
            --disable-shared
          # 说明：
          # - h264_mf / mediafoundation 依赖的 mfplat 由 configure 自动探测
          # - 其它外部库 (x264/x265/vpx/...) 默认 autodetect，找到即启用
          # - 不需要 --enable-mediafoundation，4.3 里没有这个开关

      - name: Build FFmpeg
        run: |
          set -e
          cd ffmpeg-4.3.9
          make -j"$(nproc)"
          echo "=== version ==="
          ./ffmpeg.exe -hide_banner -version
          echo "=== MF / fdk encoders ==="
          ./ffmpeg.exe -hide_banner -encoders | grep -Ei "mf|fdk" || true

      - name: Upload ffmpeg.exe
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-4.3.9-win64
          path: ffmpeg-4.3.9/ffmpeg.exe
          if-no-files-found: error
